[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
nalgebra = "0.33"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1"
